# =============================================================================
# docker-compose.yml — Ecosistema Hobbys (Qdrant + Backend FastAPI + Frontend)
# =============================================================================
# Uso:
#   docker compose up --build -d
#   Abrir http://localhost en el navegador
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Qdrant — Base de datos vectorial
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: hobbys-qdrant
    restart: unless-stopped
    ports:
      # Exponer solo si necesitás acceder desde fuera de Docker (debug/admin)
      - "6333:6333"
    volumes:
      # Persistencia de colecciones e índices vectoriales
      - qdrant_data:/qdrant/storage
    networks:
      - hobbys-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:6333/readyz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Backend — FastAPI (Python)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hobbys-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # URL interna de Qdrant (nombre del servicio Docker, no localhost)
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      CORS_ORIGINS: "http://localhost,http://localhost:80,http://127.0.0.1"
    depends_on:
      qdrant:
        condition: service_started
    networks:
      - hobbys-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Frontend — SPA React (Vite) + Nginx
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Vite inyecta esta variable en build time (opcional si usás rutas relativas /api)
        VITE_API_BASE_URL: /api
    container_name: hobbys-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      # Resolución DNS interna: http://backend:8000
      - hobbys-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# =============================================================================
# Redes
# =============================================================================
networks:
  hobbys-network:
    driver: bridge
    name: hobbys-network

# =============================================================================
# Volúmenes
# =============================================================================
volumes:
  qdrant_data:
    name: hobbys-qdrant-data
