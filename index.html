<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto Hobbys - Descubrí tu próximo taller</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #4285f4; /* Azul Google */
            --text-color: #202124;
            --bg-color: #ffffff;
            --border-color: #dfe1e5;
            --shadow-color: rgba(32,33,36,0.28);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans', sans-serif;
        }

        body {
            color: var(--text-color);
            background-color: var(--bg-color);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- ESTADO INICIAL: VISTA HOME (ESTILO GOOGLE) --- */
        .search-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 10;
            background: white;
        }

        .brand-title {
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 30px;
            color: var(--text-color);
            text-align: center;
        }
        .brand-title span { color: var(--primary-color); }

        .search-box-wrapper {
            width: 100%;
            max-width: 584px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 14px 20px;
            font-size: 16px;
            border: 1px solid var(--border-color);
            border-radius: 24px;
            outline: none;
            transition: box-shadow 0.2s;
        }

        .search-input:hover, .search-input:focus {
            box-shadow: 0 1px 6px rgba(32,33,36,0.28);
            border-color: transparent;
        }

        /* Sugerencias de lenguaje natural */
        .suggestions {
            margin-top: 18px;
            text-align: center;
            font-size: 14px;
            color: #70757a;
        }

        .suggestion-link {
            color: var(--primary-color);
            cursor: pointer;
            text-decoration: none;
            margin: 0 6px;
            display: inline-block;
        }
        .suggestion-link:hover {
            text-decoration: underline;
        }

        /* --- TRANSICIÓN: ESTADO ACTIVO (BÚSQUEDA REALIZADA) --- */
        body.results-active .search-container {
            flex: none;
            height: 80px;
            flex-direction: row;
            justify-content: flex-start;
            border-bottom: 1px solid var(--border-color);
            padding: 0 24px;
        }

        body.results-active .brand-title {
            font-size: 1.5rem;
            margin-bottom: 0;
            margin-right: 24px;
        }

        body.results-active .search-box-wrapper {
            max-width: 600px;
        }

        body.results-active .suggestions {
            display: none; /* Ocultar sugerencias en vista de resultados */
        }

        /* --- CONTENEDOR DE RESULTADOS (DESPLAZAMIENTO DESDE ABAJO) --- */
        .main-layout {
            flex: 1;
            display: flex;
            transform: translateY(100%);
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            position: relative;
            height: calc(100vh - 80px);
        }

        body.results-active .main-layout {
            transform: translateY(0);
        }

        /* Margen Izquierdo: Lista de cursos */
        .results-sidebar {
            width: 400px;
            background: #ffffff;
            border-right: 1px solid var(--border-color);
            overflow-y: auto;
            padding: 16px;
            z-index: 5;
        }

        .results-count {
            font-size: 14px;
            color: #70757a;
            margin-bottom: 16px;
        }

        .course-card {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: box-shadow 0.2s, border-color 0.2s;
        }

        .course-card:hover {
            box-shadow: 0 1px 6px rgba(32,33,36,0.15);
            border-color: var(--primary-color);
        }

        .course-title {
            font-size: 16px;
            font-weight: 600;
            color: #1a0dab; /* Azul link tradicional */
            margin-bottom: 4px;
        }

        .course-barrio {
            font-size: 13px;
            color: #006621; /* Verde Google */
            margin-bottom: 6px;
        }

        .course-desc {
            font-size: 14px;
            color: #4d5156;
            line-height: 1.4;
            margin-bottom: 8px;
        }

        .course-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            font-weight: bold;
            color: #70757a;
        }

        .course-score {
            background: #e8f0fe;
            color: var(--primary-color);
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* Margen Derecho: Contenedor del Mapa */
        #map {
            flex: 1;
            height: 100%;
            background: #e5e3df;
        }

        /* Ajustes para pantallas chicas */
        @media (max-width: 768px) {
            .main-layout { flex-direction: column-reverse; }
            .results-sidebar { width: 100%; height: 50%; }
            #map { height: 50%; }
            body.results-active .brand-title { display: none; }
        }
    </style>
</head>
<body>

    <div class="search-container" id="searchContainer">
        <h1 class="brand-title" id="brandTitle">Proyecto <span>Hobbys</span></h1>
        <div class="search-box-wrapper">
            <form id="searchForm">
                <input type="text" class="search-input" id="searchInput" placeholder="¿Qué te gustaría aprender hoy?" autocomplete="off" required>
            </form>
        </div>
        <div class="suggestions">
            Prueba con: 
            <span class="suggestion-link" onclick="fillAndSearch('quiero aprender a cocinar')">"quiero aprender a cocinar"</span>, 
            <span class="suggestion-link" onclick="fillAndSearch('artes marciales para niños')">"artes marciales para niños"</span> o 
            <span class="suggestion-link" onclick="fillAndSearch('me gustaria saber ingles')">"me gustaría saber inglés"</span>
        </div>
    </div>

    <div class="main-layout">
        <div class="results-sidebar" id="sidebar">
            <div class="results-count" id="resultsCount">Cargando resultados...</div>
            <div id="coursesList">
                </div>
        </div>
        
        <div id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
        // Configuración de la URL de tu FastAPI en local
        const API_URL = 'http://127.0.0.1:8000/api/search'; 
        
        let map;
        let markersGroup;

        // Inicializar el mapa centrado en la Ciudad Autónoma de Buenos Aires
        function initMap() {
            map = L.map('map').setView([-34.6037, -58.3816], 12); // Coordenadas del Obelisco
            
            // Capa de mapa base (OpenStreetMap estándar)
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);

            // Capa separada para los marcadores, para limpiarla fácilmente en cada búsqueda
            markersGroup = L.layerGroup().addTo(map);
        }

        // Función para disparar búsquedas desde los links de ejemplo
        function fillAndSearch(text) {
            document.getElementById('searchInput').value = text;
            executeSearch(text);
        }

        // Evento del formulario de búsqueda
        document.getElementById('searchForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const query = document.getElementById('searchInput').value;
            executeSearch(query);
        });

        // Lógica Core de la Búsqueda
        async function executeSearch(query) {
            if (!query.trim()) return;

            try {
                // 1. Activar animación CSS deslizando la barra arriba y subiendo el mapa
                document.body.classList.add('results-active');
                
                // Inicializar mapa si no está creado (se inicializa al primer submit)
                if (!map) {
                    initMap();
                }

                // Forzar a Leaflet a recalcular el tamaño del div contenedor debido a la transición CSS
                setTimeout(() => { map.invalidateSize(); }, 600);

                document.getElementById('resultsCount').innerText = "Buscando talleres perfectos para vos...";
                document.getElementById('coursesList').innerHTML = "";
                markersGroup.clearLayers();

                // 2. Llamada real a tu Backend FastAPI (POST matching con tu SearchRequest de Pydantic)
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ query: query })
                });

                if (!response.ok) throw new Error("Error en la respuesta del servidor");
                
                const data = await response.json();
                renderResults(data);

            } catch (error) {
                console.error("Error al buscar:", error);
                document.getElementById('resultsCount').innerText = "Hubo un error al conectar con el backend.";
            }
        }

        // Renderizar Tarjetas y Pines en el mapa
        function renderResults(data) {
            const countElem = document.getElementById('resultsCount');
            const listContainer = document.getElementById('coursesList');
            
            const total = data.total_resultados || data.cursos.length;
            countElem.innerText = `Cerca de ${total} resultados encontrados para tu búsqueda`;

            if (total === 0) {
                listContainer.innerHTML = "<p style='padding: 20px; color: #70757a;'>No encontramos opciones exactas. ¡Probá describiendo tu hobby de otra manera!</p>";
                return;
            }

            let bounds = []; // Para encuadrar el mapa dinámicamente según dónde estén los pines

            data.cursos.forEach(curso => {
                // --- A) Crear Tarjeta HTML ---
                const card = document.createElement('div');
                card.className = 'course-card';
                
                // Manejo de precio formateado
                const precioFormateado = curso.precio ? `$${curso.precio}` : 'Consultar';
                // Score de similitud (si tu backend lo provee) o valoración
                const scoreBadge = curso.similarity_score ? 
                    `Score: ${Math.round(curso.similarity_score * 100)}%` : 
                    `⭐ ${curso.valoracion || 'Nuevo'}`;

                card.innerHTML = `
                    <div class="course-title">${curso.titulo}</div>
                    <div class="course-barrio">${curso.barrio}</div>
                    <div class="course-desc">${curso.descripcion}</div>
                    <div class="course-meta">
                        <span>${precioFormateado} (${curso.modalidad_pago || 'Efectivo'})</span>
                        <span class="course-score">${scoreBadge}</span>
                    </div>
                `;
                
                listContainer.appendChild(card);

                // --- B) Añadir Pin al Mapa ---
                if (curso.coordenadas && curso.coordenadas.latitud && curso.coordenadas.longitud) {
                    const lat = curso.coordenadas.latitud;
                    const lng = curso.coordenadas.longitud;
                    bounds.push([lat, lng]);

                    // Popup interactivo al hacer click en el mapa
                    const popupContent = `
                        <strong>${curso.titulo}</strong><br>
                        Barrio: ${curso.barrio}<br>
                        Precio: ${precioFormateado}<br>
                        <a href="https://wa.me/${curso.whatsapp || ''}" target="_blank" style="color: green; font-weight: bold; text-decoration: none; display: inline-block; margin-top: 5px;">
                            💬 Contactar por WhatsApp
                        </a>
                    `;

                    const marker = L.marker([lat, lng]).bindPopup(popupContent);
                    markersGroup.addLayer(marker);

                    // Hacer que al clickear la tarjeta de la lista, se centre el mapa en ese pin y abra el popup
                    card.addEventListener('click', () => {
                        map.setView([lat, lng], 15, { animate: true, duration: 0.5 });
                        marker.openPopup();
                    });
                }
            });

            // Ajustar el zoom automáticamente para que todos los pines queden visibles en pantalla
            if (bounds.length > 0) {
                map.fitBounds(bounds, { padding: [50, 50] });
            }
        }
    </script>
</body>
</html>
