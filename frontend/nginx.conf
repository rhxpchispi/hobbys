# =============================================================================
# nginx.conf — Configuración del servidor para el frontend Hobbys
# =============================================================================
# Montado en: /etc/nginx/conf.d/default.conf (ver Dockerfile)
#
# Responsabilidades:
#   1. Servir la SPA compilada por Vite desde /usr/share/nginx/html
#   2. Enrutamiento SPA (try_files) para evitar 404 al recargar rutas de React
#   3. Reverse proxy de /api/* hacia el servicio backend en la red Docker
#   4. Compresión Gzip y cabeceras básicas de seguridad/optimización
# =============================================================================

# Upstream del backend FastAPI.
# "backend" es el nombre del servicio en docker-compose.yml (resolución DNS interna).
upstream fastapi_backend {
    # Puerto interno del contenedor backend (no el mapeo al host)
    server backend:8000;

    # Mantener conexiones TCP abiertas hacia el backend (reduce latencia bajo carga)
    keepalive 32;
}

server {
    # Puerto HTTP dentro del contenedor (mapeado a 80:80 en el host vía Compose)
    listen 80;
    listen [::]:80;

    # Nombre del servidor (localhost en desarrollo; reemplazar en producción real)
    server_name localhost;

    # Raíz documental: archivos estáticos generados por `vite build`
    root /usr/share/nginx/html;

    # index.html como punto de entrada de la SPA
    index index.html;

    # Charset por defecto para respuestas de texto
    charset utf-8;

    # -------------------------------------------------------------------------
    # Compresión Gzip — reduce tamaño de JS/CSS/JSON/HTML en tránsito
    # -------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # -------------------------------------------------------------------------
    # Cabeceras de seguridad básicas (aplicadas a todas las respuestas)
    # -------------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # -------------------------------------------------------------------------
    # Reverse Proxy — API FastAPI (/api/*)
    # -------------------------------------------------------------------------
    # El frontend llama a rutas relativas como POST /api/search (ver src/api/search.ts).
    # Nginx reenvía esas peticiones al backend por la red interna de Docker.
    location /api/ {
        # Reenvío al upstream; la barra final preserva el prefijo /api/ en la URL
        proxy_pass http://fastapi_backend/api/;

        # HTTP/1.1 necesario para keepalive hacia el upstream
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Cabeceras estándar de reverse proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts razonables para búsquedas que pueden consultar Qdrant
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Desactivar buffering para respuestas streaming (SSE/chunked) si el backend las usa
        proxy_buffering off;
    }

    # -------------------------------------------------------------------------
    # Assets estáticos con hash en el nombre (Vite) — caché agresiva en el navegador
    # -------------------------------------------------------------------------
    location ~* \.(?:js|css|png|jpg|jpeg|gif|webp|svg|ico|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # -------------------------------------------------------------------------
    # Enrutamiento SPA — todas las rutas no encontradas devuelven index.html
    # -------------------------------------------------------------------------
    # Evita "404 Not Found" al recargar o acceder directamente a rutas de React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Bloquear acceso a archivos ocultos (.env, .git, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
